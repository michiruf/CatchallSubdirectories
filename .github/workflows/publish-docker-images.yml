name: Publish Docker Images

on:
  push:
    tags:
      - '*'
  workflow_call: # Make this workflow callable from other workflows
  workflow_dispatch: # Make this workflow runnable on github

env:
  REGISTRY: ghcr.io

jobs:
  test:
    uses: ./.github/workflows/run-tests.yml

  # Both variants extend the generic Laravel container from
  # https://github.com/michiruf/laravel-docker (ghcr.io/michiruf/laravel-docker:<variant>-latest)
  # with the imap/excimer php extensions this application needs.
  build-variants:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    needs:
      - test
    strategy:
      matrix:
        variant:
          - baked
          - autopull
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare App for Tests
        uses: michiruf/laravel-ci/prepare-app@main
        with:
          coverage: ${{ inputs.coverage == 'true' && 'pcov' || 'none' }}
          php-version: '8.4'
          php-additional-extensions: 'imap'

      - name: Run Tests for Variant '${{ matrix.variant }}'
        run: php artisan test --group=${{ matrix.variant }} -v

      # The baked image ships with the vendor directory, therefore we need to prune dev dependencies
      - name: Prune Dev Dependencies for Baked Image
        if: matrix.variant == 'baked'
        uses: michiruf/laravel-ci/prepare-app@main
        with:
          php-version: '8.4'
          php-additional-extensions: 'imap'
          composer-options: '--no-dev --optimize-autoloader'

      - name: Publish Image Variant '${{ matrix.variant }}'
        uses: ./.github/workflows/publish-docker-image
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ github.repository_owner }}/catchall-subdirectories
          tag: ${{ matrix.variant }}
          build-context: .
          dockerfile: _docker/${{ matrix.variant }}/Dockerfile
